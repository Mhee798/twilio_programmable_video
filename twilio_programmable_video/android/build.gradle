group 'twilio.flutter.twilio_programmable_video'
version '1.0-SNAPSHOT'

buildscript {
    // Pinned rather than floating ('2.1.+') so builds are reproducible.
    ext.kotlin_version = '2.1.21'
    ext.twilio_video_version = '7.10.4'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        // Must match kotlin_version — the compiler and the stdlib it compiles
        // against have to be the same release.
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        // audioswitch below is resolved from JitPack. Added to every project rather
        // than just this one because Gradle resolves a module's dependencies against
        // the repositories of the project that consumes it; declaring it only here
        // would make the app build fail with "Could not find
        // com.github.davidliu:audioswitch". flutter_webrtc declares it the same way,
        // so an app using both ends up with one identical entry, not a conflict.
        maven { url 'https://jitpack.io' }
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-parcelize'

android {
    namespace "twilio.flutter.twilio_programmable_video"
    // Raising this forces every consuming app to raise its own compileSdk in the
    // same release: AGP fails the app build with "requires ... to be compiled
    // against a higher Android SDK version". Keep it at the level the plugin
    // actually needs and bump it only in a release that announces the break.
    compileSdkVersion 35

    // No ndkVersion here on purpose. The plugin ships no native sources of its own
    // (no CMakeLists.txt, no .c/.cpp, no jni/, no externalNativeBuild) — Twilio
    // delivers prebuilt .so files, and bundling those needs no NDK. Pinning one
    // only made Flutter tell every consumer to install and declare that exact NDK.

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        test.java.srcDirs += 'src/test/kotlin'
    }
    defaultConfig {
        minSdk 21
        // For a com.android.library module targetSdk only affects instrumentation
        // tests; the consuming app's targetSdk is what governs runtime behaviour.
        // It must not exceed compileSdkVersion above.
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }
    lintOptions {
        disable 'InvalidPackage'
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11.toString()
    }

    buildFeatures {
        viewBinding true
    }

    testOptions {
        // The unit tests only exercise pure Kotlin, but loading a class whose
        // signatures mention android.* still pulls in the stub android.jar, whose
        // every method throws by default. Returning defaults instead keeps an
        // accidental stub call from reading as a test failure with an unrelated
        // message.
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    // kotlin-stdlib-jdk7/-jdk8 were folded into kotlin-stdlib in Kotlin 1.8; the old
    // coordinates now resolve to an empty pass-through artifact. Declared explicitly
    // rather than dropped so the version stays pinned even if a consuming build sets
    // kotlin.stdlib.default.dependency=false.
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation "com.twilio:video-android:$twilio_video_version"

    // Audio device discovery and routing — see AudioRouter.kt.
    //
    // This is davidliu's fork rather than com.twilio:audioswitch, pinned to the same
    // commit flutter_webrtc ships, because only the fork has CommDeviceAudioSwitch:
    // routing through AudioManager.setCommunicationDevice, which is the only thing
    // that actually moves playout on API 31+. The last upstream release (1.2.5) has
    // no such class — it still toggles isSpeakerphoneOn and startBluetoothSco, which
    // is exactly the approach this plugin is moving away from.
    //
    // Pinned to a commit hash because JitPack has no release tags for the fork. That
    // makes the build reproducible but leaves availability in JitPack's hands; the
    // artifact is cached in ~/.gradle once resolved.
    implementation 'com.github.davidliu:audioswitch:039a35aefab7747c557242fa216c9ea11743b604'

    // Only for the JVM unit tests under src/test — see AudioRouterTest.kt for how to
    // run them (the plugin has no Gradle wrapper of its own).
    testImplementation 'junit:junit:4.13.2'
}

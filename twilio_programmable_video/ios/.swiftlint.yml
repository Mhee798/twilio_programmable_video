# See https://realm.github.io/SwiftLint/rule-directory.html for more information

excluded:
  # Swift Package Manager state. Resolving or building the package (which
  # tool/validate_package_swift.sh and the docs both tell contributors to do) drops
  # third-party checkouts under .build/, and SwiftLint does not skip dot-directories
  # on its own — without this, `swiftlint --strict` fails on vendored sources.
  - twilio_programmable_video/.build
  - twilio_programmable_video/.swiftpm

line_length: 240

identifier_name:
  min_length: 2

type_name:
  max_length: 50

opt_in_rules:
  - vertical_whitespace_opening_braces
  - vertical_whitespace_closing_braces
  - yoda_condition

disabled_rules:
  - switch_case_alignment

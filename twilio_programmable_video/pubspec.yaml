name: twilio_programmable_video
description: Flutter plugin for Twilio Programmable Video, which enables you to build real-time videocall applications (WebRTC)
version: 1.1.1
homepage: https://gitlab.com/twilio-flutter/programmable-video
repository: https://gitlab.com/twilio-flutter/programmable-video/-/tree/master/programmable_video
issue_tracker: https://gitlab.com/twilio-flutter/programmable-video/issues

environment:
  sdk: ">=3.0.0 <4.0.0"
  # Flutter 3.10 is the first release that ships Dart 3.0; anything older cannot
  # satisfy the sdk constraint above anyway, so stating it here just produces a
  # clearer resolution error.
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  permission_handler: ^12.0.1
  enum_to_string: ^2.0.1
  twilio_programmable_video_platform_interface:
    path: ../programmable_video_platform_interface
  # twilio_programmable_video_web:
  #   path: ../programmable_video_web
  collection: ^1.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  mockito: ^5.0.6
  build_runner: ^2.0.1
  # Requires Dart >=3.8, above this package's own `sdk` floor. dev_dependencies are
  # not part of the constraint a consumer resolves against, so consumers on Dart 3.0
  # are unaffected — but working *on* this repo needs 3.8 or newer. Only
  # flutter_lints 2.x reaches down to 3.0, and that predates the rules this codebase
  # now relies on. Raising the published floor to ^3.8.0 instead would make the two
  # match at the cost of every consumer.
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: twilio.flutter.twilio_programmable_video
        pluginClass: TwilioProgrammableVideoPlugin
      ios:
        pluginClass: TwilioProgrammableVideoPlugin
      # web:
      #   default_package: twilio_programmable_video_web
